<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>QuickNotes</h1>
      <p>Capture the important things, quickly.</p>
    </div>
  </header>

  <main class="container">
    <section aria-labelledby="add-note-heading">
      <h2 id="add-note-heading">Add a note</h2>
      <form id="note-form">
        <div class="form-field note-field">
          <label for="note-input">Your note</label>
          <input id="note-input" name="note" type="text" maxlength="200" placeholder="Write a note..." required>
        </div>
        <div class="form-field category-field">
          <label for="note-category">Category</label>
          <select id="note-category" name="category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message" role="alert" aria-live="polite"></p>
    </section>

    <section aria-labelledby="your-notes-heading">
      <h2 id="your-notes-heading">Your notes</h2>
      <label for="search-input">Search notes</label>
      <input id="search-input" type="search" placeholder="Search your notes...">
      <p id="note-count" aria-live="polite">You have no notes yet.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes</p>
  </footer>
</body>
</html>
